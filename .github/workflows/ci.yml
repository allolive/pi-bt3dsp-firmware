name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: "Also build the debug image (shell, Python, BlueZ tools)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Buildroot reads it from the environment: the source downloads live outside
  # the Buildroot clone, so they can be cached between runs
  BR2_DL_DIR: ${{ github.workspace }}/dl

jobs:
  test:
    name: Timing simulation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make test

  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(make -s version)" >> "$GITHUB_OUTPUT"
      - name: The tag names the release after bt3dd's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(make -s version)" = "$GITHUB_REF_NAME"
      - name: Buildroot's host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex cpio rsync unzip file wget \
            libssl-dev libncurses-dev python3
      - name: Source downloads
        uses: actions/cache@v6
        with:
          path: dl
          key: dl-${{ hashFiles('Makefile', 'configs/*', 'package/**') }}
          restore-keys: dl-
      - name: Build the image
        run: make dist
      - name: Build the debug image
        if: inputs.debug
        run: make dist-debug
      - name: Sources of what the image contains
        if: github.event_name == 'push'
        run: make legal-info
      - uses: actions/upload-artifact@v7
        with:
          name: pi-bt3dsp
          path: dist/

  release:
    name: Release
    # every build of main, and every v* tag: the add-on takes the latest
    if: github.event_name == 'push'
    needs: [test, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pi-bt3dsp
      - name: Name the release
        id: name
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ needs.image.outputs.version }}-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          gh release create "$TAG" pi-bt3dsp-* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --latest \
            --notes "Built from ${GITHUB_SHA::7}. pi-bt3dsp-<version>.tar.gz holds the boot files (unpack and send with rpiboot -d boot, or let the add-on do it); -sources.tar.gz has the sources of everything in the image."
